<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div id="options">
      <input class="option" type="checkbox" name="sums" checked>
      <label for="sums">Sums</label>
      <input class="option" type="checkbox" name="mult" checked>
      <label for="mult">Multiplication</label>
      <input class="option" type="checkbox" name="div">
      <label for="div">Division</label>
    </div>
    <div id="customize">
       <div id="sums-customize">
         <span>Digits</span>
         <input type="range" min="1" max="10" value="4" id="sums-customize-digits">
         <output></output>
         <span>Size</span>
         <input type="range" min="1" max="10" value="4" id="sums-customize-numbers">
         <output></output>
       </div>
       <div id="mult-customize">
         <span>First number</span>
         <input type="range" min="1" max="10" value="3" id="mult-customize-first-digits">           
	 <output></output>
         <span>Second number</span>
         <input type="range" min="1" max="10" value="2" id="mult-customize-second-digits">
         <output></output>
       </div>
       <div id="div-customize">
          <span>First number</span>
          <input type="range" min="1" max="10" value="3" id="div-customize-first-digits">           
	  <output></output>
          <span>Second number</span>
          <input type="range" min="1" max="10" value="2" id="div-customize-second-digits">
          <output></output>
        </div>
    </div>
  <script src="script.js" type="module"></script>
</body>
</html>
